[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-dictionary-ai"
version = "0.1.0"
description = "Local symbolic-vector AI with SQLite memory and YAML neurons"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
hf = ["sentence-transformers>=3.0,<6"]
web = ["Flask>=3.0,<4", "requests>=2.31,<3"]
all = ["sentence-transformers>=3.0,<6", "Flask>=3.0,<4", "requests>=2.31,<3"]

[project.scripts]
nda = "neural_dictionary_ai.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
